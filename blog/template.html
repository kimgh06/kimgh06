<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$ - 김강현</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='330 0 460 460'%3E%3Crect x='330' y='0' width='460' height='460' rx='96' fill='%23161513'/%3E%3Cpath d='M740 50L380 410H540L715 238M557 233H715' fill='none' stroke='%23fbfaf7' stroke-width='40' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--paper:#fbfaf7;--ink:#161513;--soft:#5d5a54;--rule:#d9d5cc;--mark:#c2410c}
@media (prefers-color-scheme:dark){
  :root{--paper:#141312;--ink:#eeece6;--soft:#a29e95;--rule:#34322e;--mark:#fb923c}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.8 "Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:56px 20px 96px}
a{color:var(--mark);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.back{font-size:15px}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;line-height:1.35}
h1{font-size:36px;margin:28px 0 6px}
.date{color:var(--soft);font-size:15px;margin:0 0 40px}
h2{font-size:23px;margin:64px 0 18px;padding-top:18px;border-top:2px solid var(--ink)}
h2:first-of-type{margin-top:0}
h3{font-size:19px;margin:36px 0 12px}
hr{display:none}
p{margin:0 0 16px}
ul{margin:0 0 20px;padding-left:20px}
li{margin:6px 0}
li>ul{margin:8px 0 14px;color:var(--ink)}
main>ul>li{margin-top:22px}
main>ul>li:first-child{margin-top:0}
footer{margin-top:80px;padding-top:20px;border-top:2px solid var(--ink);font-size:15px}
@media (max-width:640px){
  main{padding:40px 16px 72px}
  h1{font-size:28px}
  body{font-size:16px}
}
</style>
</head>
<body>
<main>
<a class="back" href="../">← 김강현</a>
<h1>$title$</h1>
<p class="date">$date$</p>
$body$
<footer><a href="../">← 김강현</a></footer>
</main>
</body>
</html>
